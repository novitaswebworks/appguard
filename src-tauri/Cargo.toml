[package]
name = "appguard"
version = "0.8.0-beta.2"
description = "Biometric Lock & Privacy Vault for Apps and Folders"
authors = ["AppGuard Authors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "appguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
image = "0.25"
plist = "1.10"
tempfile = "3"
zeroize = "1"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.5.3"
argon2 = { version = "0.6.0", features = ["password-hash", "rand_core"] }
rand = "0.10.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
block2 = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Procedural macros are loaded by rustc as dynamic libraries. Keep their
# symbols intact; stripping them can produce invalid Mach-O LINKEDIT tables.
[profile.release.build-override]
strip = false
