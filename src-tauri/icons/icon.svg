<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Outer Glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Shadow -->
    <filter id="shieldShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0284c7" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Inner Lock Glow -->
    <filter id="lockGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f2fe" flood-opacity="0.6" />
    </filter>

    <!-- App Squircle Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Cyber Shield Outer Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shield Face Inner Shading -->
    <linearGradient id="shieldInnerGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Core Lock Neon Gradient -->
    <linearGradient id="lockNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- macOS Style Squircle Canvas Background -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="6" />

  <!-- Background Cyber Circuit Accents -->
  <g opacity="0.35" stroke="url(#circuitGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M 180 320 L 320 320 L 380 380" fill="none" />
    <circle cx="180" cy="320" r="8" fill="#06b6d4" />
    
    <path d="M 844 320 L 704 320 L 644 380" fill="none" />
    <circle cx="844" cy="320" r="8" fill="#06b6d4" />

    <path d="M 220 720 L 340 720 L 400 660" fill="none" />
    <circle cx="220" cy="720" r="8" fill="#3b82f6" />

    <path d="M 804 720 L 684 720 L 624 660" fill="none" />
    <circle cx="804" cy="720" r="8" fill="#3b82f6" />
  </g>

  <!-- Ambient Radiant Glow Behind Shield -->
  <circle cx="512" cy="520" r="280" fill="#0284c7" opacity="0.22" filter="url(#outerGlow)" />

  <!-- Shield Body (Outer Crest) -->
  <g filter="url(#shieldShadow)">
    <path d="M 512 180
             C 650 180 750 220 780 260
             C 780 470 730 680 512 840
             C 294 680 244 470 244 260
             C 274 220 374 180 512 180 Z"
          fill="url(#shieldGrad)" />

    <!-- Shield Inner Bevel Inset -->
    <path d="M 512 216
             C 630 216 716 250 742 284
             C 742 466 698 646 512 788
             C 326 646 282 466 282 284
             C 308 250 394 216 512 216 Z"
          fill="url(#shieldInnerGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  </g>

  <!-- Biometric Fingerprint Arcs Inside Top Crest -->
  <g stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.3" fill="none">
    <path d="M 452 350 C 472 334 552 334 572 350" />
    <path d="M 436 376 C 466 354 558 354 588 376" />
    <path d="M 420 404 C 460 376 564 376 604 404" />
  </g>

  <!-- Central Padlock Emblem -->
  <g filter="url(#lockGlow)">
    <!-- Padlock Shackle -->
    <path d="M 436 500
             L 436 430
             C 436 388 470 354 512 354
             C 554 354 588 388 588 430
             L 588 500"
          fill="none"
          stroke="url(#lockNeon)"
          stroke-width="32"
          stroke-linecap="round" />

    <!-- Shackle Interior Accent Notch -->
    <path d="M 456 436
             C 456 405 481 380 512 380
             C 543 380 568 405 568 436"
          fill="none"
          stroke="#ffffff"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.85" />

    <!-- Padlock Solid Heavy Body -->
    <rect x="392" y="490" width="240" height="196" rx="36" fill="url(#lockNeon)" />

    <!-- Padlock Inner Core Vault Cutout -->
    <rect x="408" y="506" width="208" height="164" rx="26" fill="#0f172a" />

    <!-- Keyhole & Biometric Sensor Pin -->
    <circle cx="512" cy="570" r="22" fill="url(#lockNeon)" />
    <path d="M 504 576 L 498 626 C 498 632 502 636 508 636 L 516 636 C 522 636 526 632 526 626 L 520 576 Z" fill="url(#lockNeon)" />
    
    <!-- Core Center Specular Light -->
    <circle cx="512" cy="570" r="9" fill="#ffffff" />
  </g>

  <!-- Bottom Crest Shield Accent Star -->
  <polygon points="512,710 518,726 534,728 522,739 526,755 512,746 498,755 502,739 490,728 506,726" fill="#38bdf8" opacity="0.9" />
</svg>
