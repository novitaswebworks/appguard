name: Release Multi-Platform AppGuard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles app,dmg --target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: '--bundles msi,nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AppGuard v__VERSION__'
          releaseBody: 'AppGuard v__VERSION__ - Native Biometric Lock & Privacy Vault for Apps and Folders across macOS (Universal Binary: Apple Silicon + Intel), Windows, and Linux.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notify-homebrew:
    needs: release-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch appguard-released to homebrew-tap repo
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            --data '{
              "event_type": "appguard-released",
              "client_payload": {
                "app": "appguard",
                "version": "${{ steps.meta.outputs.VERSION }}"
              }
            }'
          echo "Dispatched appguard-released v${{ steps.meta.outputs.VERSION }} to homebrew-tap"

