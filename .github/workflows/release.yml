name: Release Multi-Platform AppGuard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdotool x11-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Browser contract tests
        if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:ui

  release-tauri:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--bundles app,dmg --target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'ubuntu-24.04-arm'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            # WiX MSI requires numeric-only prerelease identifiers. Beta
            # tags use NSIS; stable tags publish both installers.
            args: ${{ contains(github.ref_name, '-') && '--bundles nsis' || '--bundles msi,nsis' }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AppGuard v__VERSION__'
          releaseBody: 'AppGuard v__VERSION__ beta - PIN-first desktop window shielding and encrypted file vault. macOS uses Touch ID or the Master PIN; Windows and Linux use the Master PIN in this build. Linux window shielding requires X11.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  notify-downstream:
    needs: release-tauri
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.4.0")
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch appguard-released to landing page repo
        env:
          TOKEN: ${{ secrets.LANDING_PAGE_TOKEN || secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Skipping landing page dispatch: No auth token available."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/appguard-landingpage/dispatches" \
            --data '{
              "event_type": "appguard-released",
              "client_payload": {
                "app": "appguard",
                "version": "${{ steps.meta.outputs.VERSION }}"
              }
            }')
          if [ "$STATUS" = "204" ]; then
            echo "Successfully dispatched appguard-released v${{ steps.meta.outputs.VERSION }} to appguard-landingpage"
          else
            echo "Warning: Dispatch to appguard-landingpage returned HTTP $STATUS (Verify repo exists and token has contents:write permission)"
          fi

      - name: Dispatch appguard-released to homebrew-tap repo
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Skipping homebrew dispatch: HOMEBREW_TAP_TOKEN secret is not set."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            --data '{
              "event_type": "appguard-released",
              "client_payload": {
                "app": "appguard",
                "version": "${{ steps.meta.outputs.VERSION }}"
              }
            }')
          if [ "$STATUS" = "204" ]; then
            echo "Successfully dispatched appguard-released v${{ steps.meta.outputs.VERSION }} to homebrew-tap"
          else
            echo "Warning: Dispatch to homebrew-tap returned HTTP $STATUS"
          fi
