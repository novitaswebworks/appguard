name: Verify AppGuard

on:
  pull_request:
  push:
    branches: [main, master, 'release/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdotool x11-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: cargo check --locked
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - name: Install browser for UI contract tests
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: UI contract tests (mocked IPC)
        if: runner.os == 'Linux'
        run: pnpm run test:ui
